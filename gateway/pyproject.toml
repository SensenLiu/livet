[project]
name = "livet-gateway"
version = "0.1.0"
description = "LiveT BFF gateway — thin proxy for LLM/ASR/TTS/subscription/error-log"
requires-python = ">=3.8"
authors = [{ name = "LiveT" }]
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.104,<0.111",
    "uvicorn[standard]>=0.24,<0.28",
    "httpx>=0.25,<0.28",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "slowapi>=0.1.9",
    "redis>=5.0,<6",
    "python-multipart>=0.0.6",
    "sentry-sdk[fastapi]>=1.40,<2",
    # Lets Pydantic evaluate PEP 585 / PEP 604 annotations on Python <3.10.
    'eval-type-backport>=0.2; python_version < "3.10"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S"]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # FastAPI Depends() in defaults is the standard pattern
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
